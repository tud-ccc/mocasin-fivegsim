name: FiveGSim Examples Plugin CI

enable-email-notifications: true

on:
  push:
  # pull_request:
  workflow_dispatch:
    inputs:
      mocasin_branch:
        description: "Mocasin branch to test against"
        required: false
        type: string
        default: "master"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    container:
      image: python:${{ matrix.python-version }}

    steps:
      - name: Install CI and build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            nodejs \
            ca-certificates \
            build-essential \
            cmake \
            libboost-dev \
            libboost-graph-dev \
            lua5.3 \
            liblua5.3-dev \
            luarocks
          rm -rf /var/lib/apt/lists/*

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upgrade Python packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Show tool versions
        run: |
          python --version
          pip --version
          node --version
          git --version

      - name: Clone mocasin
        env:
          MOCASIN_CI_USER: ${{ secrets.MOCASIN_CI_USER }}
          MOCASIN_CI_TOKEN: ${{ secrets.MOCASIN_CI_TOKEN }}
          MOCASIN_BRANCH: ${{ inputs.mocasin_branch || github.head_ref || github.ref_name || 'master' }}
        run: |
          MOCASIN_URL="https://${MOCASIN_CI_USER}:${MOCASIN_CI_TOKEN}@git.cc.inf.tu-dresden.de/mocasin/mocasin.git"

          echo "Requested mocasin branch: ${MOCASIN_BRANCH}"

          if git clone -b "$MOCASIN_BRANCH" "$MOCASIN_URL" /tmp/mocasin; then
            echo "Using mocasin branch: ${MOCASIN_BRANCH}"
          else
            echo "Branch ${MOCASIN_BRANCH} not found in mocasin. Falling back to master."
            git clone -b master "$MOCASIN_URL" /tmp/mocasin
          fi

      - name: Build wheels
        run: |
          python -m pip wheel -w wheels /tmp/mocasin ".[dev]"

      - name: Install plugin from wheels
        run: |
          python -m pip install "fivegsim[dev]" --no-index --find-links=./wheels

      - name: Run tests
        run: |
          python -m pytest

  check-formatting:
    runs-on: ubuntu-latest

    container:
      image: python:3.10

    steps:
      - name: Install CI dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            nodejs \
            ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install and show black version
        run: |
          python -m pip install --upgrade pip
          python -m pip install black
          python -m black --version

      - name: Check formatting
        run: |
          black --check .
